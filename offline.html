<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#F5F4F2">
  <title>拾词 · 当前离线</title>
  <script>
    (function () {
      var preference = 'system';
      try {
        var saved = localStorage.getItem('shici.theme.v1');
        if (saved === 'light' || saved === 'dark' || saved === 'system') preference = saved;
      } catch (error) {}
      var dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      var theme = preference === 'system' ? (dark ? 'dark' : 'light') : preference;
      document.documentElement.dataset.theme = theme;
      document.documentElement.style.colorScheme = theme;
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute('content', theme === 'dark' ? '#171B1F' : '#F5F4F2');
    })();
  </script>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; color: #20262d; background: #f5f4f2; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; }
    main { max-width: 520px; padding: 36px; border: 1px solid rgba(48,44,38,.12); border-radius: 24px; background: #fffdf7; box-shadow: 0 24px 65px -42px rgba(50,45,38,.38); }
    .mark { display: grid; place-items: center; width: 54px; height: 54px; border-radius: 16px; color: #f8f4ea; background: #2d2923; font: 600 28px/1 "Songti SC", serif; }
    h1 { margin: 22px 0 10px; color: #20262d; font: 600 34px/1.3 -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; }
    p { margin: 0 0 22px; color: #59636d; font-size: 16px; line-height: 1.8; }
    a { display: inline-flex; min-height: 44px; align-items: center; padding: 0 20px; border-radius: 12px; color: #f8f4ea; background: #3f382f; text-decoration: none; }
    html[data-theme="dark"] body { color: #edf1f3; background: #171b1f; }
    html[data-theme="dark"] main { border-color: rgba(237,241,243,.11); background: #20262c; box-shadow: 0 24px 65px -42px rgba(0,0,0,.7); }
    html[data-theme="dark"] .mark { color: #20262d; background: #dbe5ea; }
    html[data-theme="dark"] h1 { color: #edf1f3; }
    html[data-theme="dark"] p { color: #a8b2ba; }
    html[data-theme="dark"] a { color: #f3f7f9; background: #35596d; }
  </style>
</head>
<body>
  <main>
    <span class="mark">拾</span>
    <h1>页面已离线缓存</h1>
    <p>重新联网即可打开最新词书。已经下载过的页面和当前词书会在离线时继续可用。</p>
    <a href="./#home">重新尝试</a>
  </main>
</body>
</html>
