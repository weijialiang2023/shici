name: 功能问题
description: 报告学习、离线、布局或学习记录异常
title: "[问题] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        请勿在公开 Issue 中上传完整学习记录、密码或其他个人信息。
        如果是记录异常，请先阅读反馈页中的备份步骤。
  - type: input
    id: version
    attributes:
      label: 页面版本
      description: 反馈页“匿名诊断摘要”中的“应用版本”。
      placeholder: 例如 24
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 浏览器和设备
      placeholder: 例如 Safari，iPhone 15，iOS 最新版本
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 问题区域
      options:
        - 首页
        - 学习中心
        - 学习卡片或测验
        - 我的词库
        - 词书书架
        - 学习报告
        - 设置与备份
        - 离线或安装
        - 其他
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开……
        2. 点击……
        3. 看到……
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: 提交前确认
      options:
        - label: 我已检查内容，不含姓名、手机号、住址、密码或完整学习记录
          required: true
